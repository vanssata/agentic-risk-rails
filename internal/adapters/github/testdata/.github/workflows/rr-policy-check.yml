# Generated by `rr sync`. The job name is the required status check context.
name: rr-policy-check
on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  rr-policy-check:
    name: rr-policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: go install github.com/vanssata/agentic-risk-rails/cmd/rr@latest
      - run: rr policy check --base origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
