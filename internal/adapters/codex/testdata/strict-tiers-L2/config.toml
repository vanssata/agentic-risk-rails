# Generated by `rr sync` from riskrails.yaml. Do not edit.
# Network stays off (Codex workspace-write default); enforcement.egress.allow cannot be enforced by Codex.
# .git is always read-only in the Codex sandbox, so no .git rules are emitted.

default_permissions = 'riskrails'
sandbox_mode = 'workspace-write'
approval_policy = 'never'

[sandbox_workspace_write]
network_access = false

[agents]
default_subagent_model = 'gpt-5-mini'
default_subagent_reasoning_effort = 'medium'
max_concurrent_threads_per_session = 3

[permissions]
[permissions.riskrails]
[permissions.riskrails.filesystem]
'/' = 'read'
'/home/test/.aws/**' = 'deny'
'/home/test/.cache/riskrails/**' = 'deny'
'/home/test/.config/riskrails/**' = 'deny'
'/home/test/.ssh/**' = 'deny'
'/tmp' = 'write'

[permissions.riskrails.filesystem.':workspace_roots']
'**/.env*' = 'deny'
'.' = 'write'
'.agents/**' = 'read'
'.claude/**' = 'read'
'.codex/**' = 'read'
'.cursor/**' = 'read'
'.gemini/**' = 'read'
'.githooks/**' = 'read'
'.github/**' = 'read'
'.kiro/**' = 'read'
'.mcp.json' = 'read'
'.opencode/**' = 'read'
'.rr/**' = 'read'
'opencode.json' = 'read'
'riskrails.yaml' = 'read'

[mcp_servers]
[mcp_servers.rr]
command = 'rr'
args = ['mcp']
default_tools_approval_mode = 'approve'
