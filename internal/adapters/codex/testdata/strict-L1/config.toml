# Generated by `rr sync` from riskrails.yaml. Do not edit.
# Network stays off (Codex workspace-write default); enforcement.egress.allow cannot be enforced by Codex.
# .git is always read-only in the Codex sandbox, so no .git rules are emitted.

default_permissions = 'riskrails'
sandbox_mode = 'workspace-write'
approval_policy = 'on-request'

[sandbox_workspace_write]
network_access = false

[agents]
max_concurrent_threads_per_session = 3

[permissions]
[permissions.riskrails]
[permissions.riskrails.filesystem]
'/' = 'read'
'/home/test/.aws/**' = 'deny'
'/home/test/.cache/riskrails/**' = 'deny'
'/home/test/.config/riskrails/**' = 'deny'
'/home/test/.ssh/**' = 'deny'
'/tmp' = 'write'

[permissions.riskrails.filesystem.':workspace_roots']
'.' = 'write'
'.env*' = 'deny'
'.github/**' = 'read'
'riskrails.yaml' = 'read'
