# Generated by rr. Packagist publishes through its push webhook: there is no publish step here.
name: rr-release-composer
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          tools: composer
      - run: composer validate --strict
      - run: composer audit
